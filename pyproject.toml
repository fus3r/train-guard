[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "train-guard"
version = "0.4.0.dev0"
description = "Power-aware process supervision for long-running local compute jobs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "fus3r" }]
keywords = ["battery", "laptop", "thermal", "macbook", "training", "power", "psutil", "cli", "deep-learning"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.10",
  "pytest>=8,<9",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.10",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.9",
  "types-psutil>=6.1",
]

[project.urls]
Homepage = "https://github.com/fus3r/train-guard"
Issues = "https://github.com/fus3r/train-guard/issues"
Source = "https://github.com/fus3r/train-guard"

[project.scripts]
train-guard = "trainguard.cli:main"

[tool.setuptools]
packages = ["trainguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["trainguard"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]
ignore = ["SIM105", "SIM108", "SIM115"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
always_true = ["__package__"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
