name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Build native replay kernel
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release
      - name: Run bit-exact differential benchmark
        shell: bash
        run: |
          kernel="native/build/train-guard-kernel"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            kernel="native/build/Release/train-guard-kernel.exe"
          fi
          python tools/bench_sweep.py --samples 4000 --kernel "${kernel}"
      - name: Compile package
        run: python -m compileall -q trainguard
      - name: Check legacy macOS script syntax
        if: runner.os != 'Windows'
        run: bash -n legacy/macos-shell/train-guard.sh

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy trainguard
      - name: Test with branch coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage combine
          python -m coverage report -m
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify source archive contents
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archive = glob.glob("dist/*.tar.gz")
          if len(archive) != 1:
              raise SystemExit(f"expected one source archive, found {archive}")
          with tarfile.open(archive[0]) as source:
              names = source.getnames()
          required = (
              "config.example.json",
              "docs/architecture.md",
              "docs/failure-model.md",
              "docs/policy-replay.md",
              "docs/policy-sweep.md",
              "examples/power-trace.jsonl",
              "legacy/macos-shell/train-guard.sh",
              "native/CMakeLists.txt",
              "native/replay_kernel.cpp",
              "tests/conftest.py",
              "tests/test_e2e.py",
              "tests/test_native.py",
              "tools/bench_sweep.py",
          )
          for path in required:
              if not any(name.endswith(f"/{path}") for name in names):
                  raise SystemExit(f"source archive is missing {path}")
          if any("/native/build/" in f"/{name}/" for name in names):
              raise SystemExit("source archive contains native/build artifacts")
          PY
      - name: Install and test the source archive in a clean environment
        run: |
          sdist_source_root="${RUNNER_TEMP}/train-guard-sdist"
          sdist_venv="${RUNNER_TEMP}/train-guard-sdist-venv"
          mkdir -p "${sdist_source_root}"
          tar -xzf dist/*.tar.gz -C "${sdist_source_root}"
          sdist_extracted="$(find "${sdist_source_root}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python -m venv "${sdist_venv}"
          "${sdist_venv}/bin/python" -m pip install "${sdist_extracted}[test]"
          cd "${sdist_extracted}"
          "${sdist_venv}/bin/python" -m pytest
      - name: Install and smoke-test the wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/train-guard-wheel"
          "${RUNNER_TEMP}/train-guard-wheel/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/train-guard-wheel/bin/python" -m pip check
          "${RUNNER_TEMP}/train-guard-wheel/bin/train-guard" --version
          "${RUNNER_TEMP}/train-guard-wheel/bin/train-guard" --help > /dev/null
          "${RUNNER_TEMP}/train-guard-wheel/bin/train-guard" simulate \
            examples/power-trace.jsonl --config config.example.json --json > /dev/null
          "${RUNNER_TEMP}/train-guard-wheel/bin/train-guard" simulate \
            examples/power-trace.jsonl --config config.example.json \
            --compare-config examples/battery-enabled-policy.json --json > /dev/null
          printf '{"temp_pause_c": [40, 42, 44], "run_on_battery": [true, false]}' \
            > "${RUNNER_TEMP}/sweep-grid.json"
          "${RUNNER_TEMP}/train-guard-wheel/bin/train-guard" sweep \
            examples/power-trace.jsonl --grid "${RUNNER_TEMP}/sweep-grid.json" \
            --engine python --json > /dev/null
